[package]
name = "cmsg-cfrm-composition"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
cmsg = { path = "../.." }
cfrm = { path = "../../.ci-dependencies/cfrm", features = ["permit-issuer"] }
data-encoding = "2.9"
ed25519-dalek = "2.2"
serde = "1"
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
tempfile = "3"
openssl = "0.10"

[profile.test.package."*"]
opt-level = 3
