name: Security experiments
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - name: Behavioural tests
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all-targets
          cargo test --locked --test scale -- --nocapture
      - name: Dependency resolution record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dependency-lock
          path: Cargo.lock
          retention-days: 3

  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, aarch64-apple-ios]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Rust target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Native core cross-target type check
        run: cargo check --locked --lib --target ${{ matrix.target }}
