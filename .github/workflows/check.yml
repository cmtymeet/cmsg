name: Native cross-target checks
on:
  push:
    paths: ["Cargo.*", "src/**", "tests/**", "examples/**", ".github/workflows/check.yml"]
  pull_request:
    paths: ["Cargo.*", "src/**", "tests/**", "examples/**", ".github/workflows/check.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, aarch64-apple-ios]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Rust target
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Native core cross-target type check
        run: cargo check --locked --lib --target ${{ matrix.target }}
