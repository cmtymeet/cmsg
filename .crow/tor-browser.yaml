when:
  - event: manual
skip_clone: true
variables:
  SOURCE_ARCHIVE: {default: ""}
  SOURCE_SHA256: {default: ""}
  TORJS_SOURCE_ARCHIVE: {default: ""}
  TORJS_SOURCE_SHA256: {default: ""}
  ARTI_SOURCE_ARCHIVE: {default: ""}
  ARTI_SOURCE_SHA256: {default: ""}
  ARTIFACT_ROOT: {default: ""}
  CARGO_TARGET_DIR: {default: ""}
  TOR_STAGE: {default: "service"}
  WASM_LINKER: {default: ""}
  BROWSER_BIN: {default: ""}
  OPENSSL_INCLUDE_DIR: {default: ""}
  OPENSSL_LIB_DIR: {default: ""}
steps:
  - name: verified-source
    image: bash
    commands:
      - |
        set -eu
        test -n "$SOURCE_ARCHIVE"
        test -n "$SOURCE_SHA256"
        printf '%s  %s\n' "$SOURCE_SHA256" "$SOURCE_ARCHIVE" | sha256sum --check --strict
        test "$(git get-tar-commit-id < "$SOURCE_ARCHIVE")" = "$CI_COMMIT_SHA"
        tar --extract --touch --file "$SOURCE_ARCHIVE" --no-same-owner
  - name: pinned-arti-browser
    image: bash
    depends_on: [verified-source]
    environment:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
    commands:
      - |
        set -eu
        test -n "$CARGO_TARGET_DIR"
        test -n "$ARTIFACT_ROOT"
        mkdir -p "$CARGO_TARGET_DIR"
        flock "$CARGO_TARGET_DIR.ci.lock" bash .ci/tor-browser-checks.sh
