# Synthetic behavior tests. Public Tor routing is a separate explicit run;
# neither compilation nor local adapter tests establish network anonymity.
when:
  - event: manual
skip_clone: true
steps:
  - name: verified-source-checkout
    image: bash
    commands:
      - |
        ci_source_dir="/workspaces/component-sources/cmsg"
        ci_source_archive="$ci_source_dir/$CI_COMMIT_SHA.tar"
        (cd "$ci_source_dir" && sha256sum --check "$CI_COMMIT_SHA.tar.sha256")
        test "$(git get-tar-commit-id < "$ci_source_archive")" = "$CI_COMMIT_SHA"
        tar --extract --touch --file "$ci_source_archive" --no-same-owner
  - name: owned-onion-adapter-tests
    image: bash
    depends_on: [verified-source-checkout]
    environment:
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: /caches/cargo/component-targets/cmsg
    commands:
      - |
        mkdir -p "$CARGO_TARGET_DIR"
        flock "$CARGO_TARGET_DIR.ci.lock" bash -euc '
          cargo fmt --manifest-path experiments/embedded-onion/Cargo.toml --all -- --check
          timeout 1800 cargo test --locked --manifest-path experiments/embedded-onion/Cargo.toml --all-targets -- --nocapture
        '
