# Synthetic behavior tests. Public Tor routing is a separate explicit run;
# neither compilation nor local adapter tests establish network anonymity.
when:
  - event: manual
skip_clone: true
steps:
  - name: verified-source-checkout
    image: bash
    commands:
      - |
        ci_source_dir="/workspaces/component-sources/cmsg"
        ci_source_archive="$ci_source_dir/$CI_COMMIT_SHA.tar"
        (cd "$ci_source_dir" && sha256sum --check "$CI_COMMIT_SHA.tar.sha256")
        test "$(git get-tar-commit-id < "$ci_source_archive")" = "$CI_COMMIT_SHA"
        tar --extract --touch --file "$ci_source_archive" --no-same-owner
  - name: owned-onion-adapter-tests
    image: bash
    depends_on: [verified-source-checkout]
    environment:
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: /caches/cargo/component-targets/cmsg
    commands:
      - |
        mkdir -p "$CARGO_TARGET_DIR"
        flock "$CARGO_TARGET_DIR.ci.lock" bash -euc '
          ci_test_status=0
          cargo fmt --manifest-path experiments/embedded-onion/Cargo.toml --package cmsg-embedded-onion-experiment -- --check || ci_test_status=1
          timeout 1800 cargo test --locked --manifest-path experiments/embedded-onion/Cargo.toml --all-targets --no-fail-fast -- --nocapture || ci_test_status=1
          exit "$ci_test_status"
        '
  - name: capture-formatted-source
    image: bash
    depends_on: [owned-onion-adapter-tests]
    when:
      - status: [success, failure]
    commands:
      - |
        # Tests above use the verified source. Formatting occurs afterward;
        # retrieve/commit these owned files before claiming a final green source.
        cargo fmt --manifest-path experiments/embedded-onion/Cargo.toml --package cmsg-embedded-onion-experiment
        ci_artifact_dir="/workspaces/component-releases/cmsg/$CI_COMMIT_SHA"
        mkdir -p "$ci_artifact_dir"
        tar --create --file "$ci_artifact_dir/embedded-onion-formatted.tar" --directory experiments/embedded-onion src/lib.rs src/main.rs tests/contracts.rs
        (cd "$ci_artifact_dir" && sha256sum embedded-onion-formatted.tar > embedded-onion-formatted.tar.sha256)
        cat "$ci_artifact_dir/embedded-onion-formatted.tar.sha256"
