when:
  - event: manual
skip_clone: true
variables:
  SOURCE_ARCHIVE: {default: ""}
  SOURCE_SHA256: {default: ""}
  CHUTNEY_SOURCE_ARCHIVE: {default: ""}
  CHUTNEY_SOURCE_SHA256: {default: ""}
  ARTIFACT_ROOT: {default: ""}
  TOOL_ROOT: {default: ""}
  UV_BIN: {default: ""}
  OPENSSL_INCLUDE_DIR: {default: ""}
  OPENSSL_LIB_DIR: {default: ""}
  LIBEVENT_INCLUDE_DIR: {default: ""}
  LIBEVENT_LIB_DIR: {default: ""}
  ZLIB_INCLUDE_DIR: {default: ""}
  ZLIB_LIB_DIR: {default: ""}
steps:
  - name: verified-source
    image: bash
    commands:
      - |
        set -eu
        test -n "$SOURCE_ARCHIVE"
        test -n "$SOURCE_SHA256"
        printf '%s  %s\n' "$SOURCE_SHA256" "$SOURCE_ARCHIVE" | sha256sum --check --strict
        test "$(git get-tar-commit-id < "$SOURCE_ARCHIVE")" = "$CI_COMMIT_SHA"
        tar --extract --touch --file "$SOURCE_ARCHIVE" --no-same-owner
  - name: isolated-tor-tools
    image: bash
    depends_on: [verified-source]
    environment:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
    commands:
      - |
        set -eu
        test -n "$TOOL_ROOT"
        test -n "$ARTIFACT_ROOT"
        mkdir -p "$TOOL_ROOT"
        flock "$TOOL_ROOT.ci.lock" bash .ci/tor-tools.sh
