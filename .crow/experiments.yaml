# Manual execution on an existing trusted worker, with a source archive staged
# by the maintainer. The archive checksum and embedded Git commit must match.
# This workflow does not provision infrastructure or claim mobile device tests.
when:
  - event: manual
skip_clone: true
steps:
  - name: verified-source-checkout
    image: bash
    commands:
      - |
        ci_source_dir="/workspaces/component-sources/cmsg"
        ci_source_archive="$ci_source_dir/$CI_COMMIT_SHA.tar"
        (cd "$ci_source_dir" && sha256sum --check "$CI_COMMIT_SHA.tar.sha256")
        test "$(git get-tar-commit-id < "$ci_source_archive")" = "$CI_COMMIT_SHA"
        tar --extract --file "$ci_source_archive" --no-same-owner
  - name: native-behavioral-tests
    image: bash
    depends_on: [verified-source-checkout]
    environment:
      CARGO_BUILD_JOBS: "2"
    commands:
      - rustc --version
      - cargo --version
      - timeout 1200 cargo test --locked --all-targets --no-fail-fast -- --nocapture
