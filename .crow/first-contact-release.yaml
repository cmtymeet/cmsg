# Isolated sender release experiment with synthetic operator attestations.
# Does not claim integration with the cfrm accounting ledger or live Tor.
when:
  - event: manual
skip_clone: true
steps:
  - name: verified-source-checkout
    image: bash
    commands:
      - |
        ci_source_dir="/workspaces/component-sources/cmsg"
        ci_source_archive="$ci_source_dir/$CI_COMMIT_SHA.tar"
        (cd "$ci_source_dir" && sha256sum --check "$CI_COMMIT_SHA.tar.sha256")
        test "$(git get-tar-commit-id < "$ci_source_archive")" = "$CI_COMMIT_SHA"
        tar --extract --touch --file "$ci_source_archive" --no-same-owner
  - name: withheld-first-contact-tests
    image: bash
    depends_on: [verified-source-checkout]
    environment:
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: /caches/cargo/component-targets/cmsg
    commands:
      - |
        mkdir -p "$CARGO_TARGET_DIR"
        flock "$CARGO_TARGET_DIR.ci.lock" bash -euc '
          ci_test_status=0
          cargo fmt --manifest-path experiments/first-contact-release/Cargo.toml --package cmsg-first-contact-release-experiment -- --check || ci_test_status=1
          timeout 1200 cargo test --locked --manifest-path experiments/first-contact-release/Cargo.toml --all-targets -- --nocapture || ci_test_status=1
          exit "$ci_test_status"
        '
  - name: capture-formatted-source
    image: bash
    depends_on: [withheld-first-contact-tests]
    when:
      - status: [success, failure]
    commands:
      - |
        cargo fmt --manifest-path experiments/first-contact-release/Cargo.toml --package cmsg-first-contact-release-experiment
        ci_artifact_dir="/workspaces/component-releases/cmsg/$CI_COMMIT_SHA"
        mkdir -p "$ci_artifact_dir"
        tar --create --file "$ci_artifact_dir/first-contact-release-formatted.tar" --directory experiments/first-contact-release src/lib.rs tests/contracts.rs
        (cd "$ci_artifact_dir" && sha256sum first-contact-release-formatted.tar > first-contact-release-formatted.tar.sha256)
        cat "$ci_artifact_dir/first-contact-release-formatted.tar.sha256"
