# Isolated sender release experiment with synthetic operator attestations.
# Does not claim integration with the cfrm accounting ledger or live Tor.
when:
  - event: manual
skip_clone: true
steps:
  - name: verified-source-checkout
    image: bash
    commands:
      - |
        ci_source_dir="/workspaces/component-sources/cmsg"
        ci_source_archive="$ci_source_dir/$CI_COMMIT_SHA.tar"
        (cd "$ci_source_dir" && sha256sum --check "$CI_COMMIT_SHA.tar.sha256")
        test "$(git get-tar-commit-id < "$ci_source_archive")" = "$CI_COMMIT_SHA"
        tar --extract --touch --file "$ci_source_archive" --no-same-owner
  - name: withheld-first-contact-tests
    image: bash
    depends_on: [verified-source-checkout]
    environment:
      CARGO_BUILD_JOBS: "2"
      CARGO_TARGET_DIR: /caches/cargo/component-targets/cmsg
    commands:
      - |
        mkdir -p "$CARGO_TARGET_DIR"
        flock "$CARGO_TARGET_DIR.ci.lock" bash -euc '
          ci_test_status=0
          cargo fmt --manifest-path experiments/first-contact-release/Cargo.toml --all -- --check || ci_test_status=1
          timeout 1200 cargo test --locked --manifest-path experiments/first-contact-release/Cargo.toml --all-targets -- --nocapture || ci_test_status=1
          exit "$ci_test_status"
        '
