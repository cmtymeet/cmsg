[package]
name = "cmsg"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.97.1"
description = "Experimental anonymous-transport MLS text messaging core"
repository = "https://github.com/corbet-labs/cmsg"
license-file = "LICENSE.md"
readme = "README.md"
publish = false
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE.md",
    "README.md",
    "src/**",
    "tests/**",
    "examples/*.rs",
    "docs/*.md",
    "studies/*.md",
    "experiments/**/*.md",
]

[dependencies]
openmls = "=0.9.0"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
tls_codec = "0.5.0"
chacha20poly1305 = "0.10.1"
getrandom = "0.3"
zeroize = { version = "1.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
sha2 = "0.10"
ed25519-dalek = "2.2"
data-encoding = "2.9"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tokio-socks = "0.5.3"

[dev-dependencies]

# Keep integration code debuggable while avoiding unrealistic debug-only crypto costs.
[profile.test.package."*"]
opt-level = 3
